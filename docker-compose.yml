services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: licenseledger
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # files run in alphabetical order, only on first start of an empty volume
      - ./db:/docker-entrypoint-initdb.d:ro
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
volumes:
  pgdata:
  mongodata:
